<text x="40" y="46" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="25" font-weight="700" fill="#10281A" text-anchor="start" opacity="1">AgriMart — System Architecture</text><text x="40" y="72" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#647568" text-anchor="start" opacity="1">Three-tier architecture with a CMS back office and external integrations</text><line x1="40" y1="86" x2="1400" y2="86" stroke="#DCE5D5" stroke-width="1" opacity="1"/><rect x="60" y="110" width="1320" height="130" fill="#E4EDD6" stroke="#DCE5D5" stroke-width="1"/><rect x="60" y="260" width="1320" height="420" fill="none" stroke="#DCE5D5" stroke-width="1"/><rect x="60" y="700" width="1320" height="130" fill="#E4EDD6" stroke="#DCE5D5" stroke-width="1"/><text x="76" y="136" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" fill="#16402A" text-anchor="start" opacity="1">Presentation</text><text x="76" y="286" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" fill="#16402A" text-anchor="start" opacity="1">Application</text><text x="76" y="726" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" fill="#16402A" text-anchor="start" opacity="1">Data</text><rect x="200" y="150" width="400" height="64" fill="#FFFFFF" stroke="#10281A" stroke-width="1"/><text x="400" y="178" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#10281A" text-anchor="middle" opacity="1">Browser / Mobile Browser</text><text x="400" y="198" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#647568" text-anchor="middle" opacity="1">responsive HTML, CSS and JS</text><rect x="200" y="310" width="400" height="70" fill="#FFFFFF" stroke="#10281A" stroke-width="1"/><text x="400" y="341" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#10281A" text-anchor="middle" opacity="1">Next.js Front-end</text><text x="400" y="361" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#647568" text-anchor="middle" opacity="1">server-rendered React UI</text><rect x="200" y="420" width="400" height="70" fill="#FFFFFF" stroke="#10281A" stroke-width="1"/><text x="400" y="451" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#10281A" text-anchor="middle" opacity="1">REST API + JWT</text><text x="400" y="471" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#647568" text-anchor="middle" opacity="1">custom Node.js controllers</text><rect x="200" y="530" width="400" height="70" fill="#FFFFFF" stroke="#10281A" stroke-width="1"/><text x="400" y="561" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#10281A" text-anchor="middle" opacity="1">Strapi CMS</text><text x="400" y="581" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#647568" text-anchor="middle" opacity="1">content types · users &amp; roles · admin panel</text><rect x="200" y="740" width="400" height="60" fill="#FFFFFF" stroke="#10281A" stroke-width="1"/><text x="400" y="766" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#10281A" text-anchor="middle" opacity="1">MySQL</text><text x="400" y="786" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#647568" text-anchor="middle" opacity="1">relational database (agrimart_db)</text><text x="412" y="268" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#647568" text-anchor="start" opacity="1">HTTPS</text><text x="412" y="404" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#647568" text-anchor="start" opacity="1">REST / JSON</text><text x="412" y="514" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#647568" text-anchor="start" opacity="1">queries</text><text x="412" y="678" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#647568" text-anchor="start" opacity="1">SQL</text><path d="M400,214 L400,308" fill="none" stroke="#10281A" stroke-width="1.4" marker-end="url(#arrow)" opacity="1"/><path d="M400,380 L400,418" fill="none" stroke="#10281A" stroke-width="1.4" marker-end="url(#arrow)" opacity="1"/><path d="M400,490 L400,528" fill="none" stroke="#10281A" stroke-width="1.4" marker-end="url(#arrow)" opacity="1"/><path d="M400,600 L400,738" fill="none" stroke="#10281A" stroke-width="1.4" marker-end="url(#arrow)" opacity="1"/><rect x="700" y="290" width="680" height="330" fill="#FFFFFF" stroke="#A9B8A3" stroke-width="1" stroke-dasharray="6 5"/><text x="716" y="312" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" fill="#16402A" text-anchor="start" opacity="1">External services</text><rect x="920" y="330" width="320" height="56" fill="#FFFFFF" stroke="#10281A" stroke-width="1"/><text x="1080" y="354" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#10281A" text-anchor="middle" opacity="1">PayMongo</text><text x="1080" y="374" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#647568" text-anchor="middle" opacity="1">payment gateway (sandbox)</text><rect x="920" y="460" width="320" height="56" fill="#FFFFFF" stroke="#10281A" stroke-width="1"/><text x="1080" y="484" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#10281A" text-anchor="middle" opacity="1">SMTP / Gmail</text><text x="1080" y="504" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#647568" text-anchor="middle" opacity="1">transactional email</text><rect x="920" y="590" width="320" height="56" fill="#FFFFFF" stroke="#10281A" stroke-width="1"/><text x="1080" y="614" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#10281A" text-anchor="middle" opacity="1">Google Maps</text><text x="1080" y="634" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#647568" text-anchor="middle" opacity="1">store locator + delivery map</text><path d="M600,455 L740,455" fill="none" stroke="#10281A" stroke-width="1.4" opacity="1"/><line x1="740" y1="358" x2="740" y2="618" stroke="#10281A" stroke-width="1.4" opacity="1"/><path d="M740,358 L920,358" fill="none" stroke="#10281A" stroke-width="1.4" marker-end="url(#arrow)" opacity="1"/><text x="830" y="350" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#647568" text-anchor="middle" opacity="1">payment request</text><path d="M740,488 L920,488" fill="none" stroke="#10281A" stroke-width="1.4" marker-end="url(#arrow)" opacity="1"/><text x="830" y="480" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#647568" text-anchor="middle" opacity="1">SMTP send</text><path d="M740,618 L920,618" fill="none" stroke="#10281A" stroke-width="1.4" marker-end="url(#arrow)" opacity="1"/><text x="830" y="610" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#647568" text-anchor="middle" opacity="1">map embed</text><text x="76" y="856" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#647568" text-anchor="start" opacity="1">Third-party calls are made server-side; credentials are read from environment variables (.env).</text><line x1="40" y1="886" x2="1400" y2="886" stroke="#DCE5D5" stroke-width="1" opacity="1"/><text x="40" y="906" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#647568" text-anchor="start" opacity="1">AgriMart · Web Systems and Technologies 2 / System Integration and Architecture 1</text>
